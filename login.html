<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login - MareaLive</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <!-- TOP BAR -->
        <div class="topbar">
            <a href="#" class="btn-top">Suscripción</a>

            <!-- LOGO CENTRADO -->
            <a href="index.html" class="logo-link" aria-label="Ir a la página de inicio">
                <img src="img/logos/logo.png" class="logo" alt="MareaLive">
            </a>

            <a href="login.html" class="btn-top">Iniciar sesión</a>
        </div>

        <!-- MENÚ -->
        <nav class="navbar">
            <ul class="menu-izq">
                <li><a href="playas.html">Playas</a></li>
                <li><a href="tienda.html">Tienda</a></li>
            </ul>

            <ul class="menu-der">
                <li><a href="#">Mis playas</a></li>
                <li><a href="conocenos.html">Conócenos</a></li>
            </ul>
        </nav>
    </header>


    <!-- FORMULARIO -->
    <section class="login-container">

        <form class="login-form">

            <h1>Iniciar sesión</h1>

            <label>Correo electrónico</label>
            <input type="email" placeholder="ejemplo@gmail.com">

            <label>Contraseña</label>
            <input type="password" placeholder="********">

            <label>Tipo de usuario</label>

            <select>
                <option>Usuario</option>
                <option>Administrador</option>
            </select>

            <button type="submit">Entrar</button>

            <p class="registro">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate</a>
            </p>

        </form>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>© 2025 MareaLive</p>
    </footer>

</body>

</html>
