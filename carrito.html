<!DOCTYPE html>
<html lang="es">

<head>

    <!-- NAVBAR -->

            <a href="login.html" class="btn-top">Iniciar sesión</a>

        <!-- MENÚ -->

            <ul class="menu-izq">
                <li><a href="playas.html">Playas</a></li>

                <img src="img/carrete-shimano.png">
